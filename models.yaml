# Sound for a video (orazaka-packs#25, app/sound.py + app/sound_generators.py). Two kinds of model make the
# tracks; the mix, the -14 LUFS pass and the AAC mux are ffmpeg and need none. The voice-over is a speech
# asset (the Piper voices of the catalogue), never a model of this file.
#
# `commercial` is the licence of the WEIGHTS: the default of a kind must be commercial. Checked in
# test_sound_models.py.
sound:
  # Music bed from a prompt. ACE-Step 1.5 XL turbo, in the Diffusers layout: 8 steps, 48 kHz stereo.
  acestep-v15-xl-turbo:
    kind: music
    label: "ACE-Step 1.5 XL turbo (music bed)"
    licence: MIT
    licenceUrl: https://huggingface.co/ACE-Step/acestep-v15-xl-turbo-diffusers
    commercial: true
    default: true
    repo: ACE-Step/acestep-v15-xl-turbo-diffusers
    revision: 200ba991ae448051e14b0183157e35c2d27c9fb0
    steps: 8
    guidance: 7.0
    minSeconds: 10          # the model's shortest piece: a shorter clip gets the bed cut to it
    maxSeconds: 120
    sampleRate: 48000
    downloadGb: 15.5
    ramGb: 24
    hardware: [mps, cuda]

  # Video-to-audio foley, synchronised to the picture. MMAudio's code is MIT but its WEIGHTS are CC-BY-NC 4.0:
  # evaluation and non-commercial use only. Never a default; a job must ask for it by name.
  mmaudio-large-44k-v2:
    kind: foley
    label: "MMAudio large 44k v2 (video-to-audio foley) — non-commercial"
    licence: CC-BY-NC-4.0
    licenceUrl: https://github.com/hkchengrex/MMAudio#licenses
    commercial: false
    default: false
    variant: large_44k_v2
    maxSeconds: 8           # trained on 8 s: the runner asks for the clip's own length, never more than this
    sampleRate: 44100
    hardware: [mps, cuda]

# The narrator of a cinematic short (orazaka#289, ADR-080 addendum v2): an expressive voice, directed per line by
# app/voice_direction.py and said by app/zonos_runner.py in its own interpreter (SPEECH_PYTHON). Chosen over Kokoro (flat),
# Chatterbox (French misses) in a blind A/B; F5-TTS (CC-BY-NC weights) and XTTS-v2 (CPML) refused for their licences.
narrators:
  zonos-v0.1-transformer:
    label: "Zonos v0.1 transformer (expressive narrator: emotion, rate, pitch)"
    licence: Apache-2.0
    licenceUrl: https://huggingface.co/Zyphra/Zonos-v0.1-transformer
    commercial: true
    repo: Zyphra/Zonos-v0.1-transformer
    revision: 9fe3dbdc3c703a8cf7141b2d0f550f6d55f67260
    code: https://github.com/Zyphra/Zonos
    codeRevision: bc40d98e1e1ab54fc65c483be127a90e3c7c0645
    # The speaker is a reference recording of a synthetic voice (Kokoro-82M, Apache-2.0), never a real person's.
    reference: kokoro-82m
    languages: [en-us, fr-fr]
    hardware: [cpu, cuda]

# What a GPU host of each size serves. `scripts/gpu-dev.sh start big|small` (krizaka/orazaka) passes
# the profile; `python -m app.fetch_models <profile>` puts its weights on the models volume once.
profiles:
  big:
    video: [wan2.2-ti2v-5b, wan2.1-t2v-1.3b]
    defaultVideo: wan2.2-ti2v-5b
    image: flux-2-klein-4b
  # An 80 GB card for the 720p showcase: the A14B experts and the 5B, no image engine (an 80 GB pod runs one thing at a time).
  hero:
    video: [wan2.2-t2v-a14b, wan2.2-ti2v-5b]
    defaultVideo: wan2.2-ti2v-5b
  # A cinematic short (ADR-080): FLUX keyframes (sd-server) and the 4-step I2V A14B shots on one 80 GB card, and the
  # music bed. The image engine holds ~10 GB; the offloaded A14B keeps one expert (~29 GB) on the card at a time.
  cinema:
    video: [wan2.2-i2v-a14b, wan2.2-i2v-a14b-hq]
    defaultVideo: wan2.2-i2v-a14b
    image: flux-2-klein-4b
    sound: [acestep-v15-xl-turbo]
    # The voice-over (app/speech_server.py): Kokoro-82M, Apache-2.0, pinned there; served on the image engine's port.
    speech: kokoro-82m
  # The Krizaka cinematic kit: FLUX stills at the video's own aspect, then the model the bake-off picks per use — LTX-Video 0.9.8 for
  # landscape and iteration (14 s a clip), Wan 2.2 I2V A14B at 40 steps for people in 9:16 (18 min), the 4-step distill between them.
  kit:
    video: [ltx-video-0.9.8-13b-distilled, wan2.2-i2v-a14b-hq, wan2.2-i2v-a14b]
    defaultVideo: ltx-video-0.9.8-13b-distilled
    image: flux-2-klein-4b
    sound: [acestep-v15-xl-turbo]
  small:
    video: [wan2.2-ti2v-5b, wan2.1-t2v-1.3b]
    defaultVideo: wan2.1-t2v-1.3b
    image: flux-2-klein-4b
