# What this worker knows how to run, and how (ADR-075 for images, ADR-077 for 9:16 video).
#
# The CATALOGUE — which model a capability uses by default, which ones a Studio offers, which provider
# serves them — is data in the platform's database (orazaka_models, ai_providers). This file is the
# other half, the worker's own: for each model name the catalogue may send, where its weights come
# from (pinned), how big they are, and how it is run. A model the catalogue names and this file does
# not is refused by name, never replaced by another one.
#
# Weights whose licence allows commercial use are the defaults. A model that does not (`commercial: false`,
# e.g. CC-BY-NC) may be listed so it can be tried, is never a default, and says so in its row.

video:
  # Wan 2.2 TI2V 5B — the 9:16 model of the GPU droplet `big`. 720p class (704x1280 vertical) at
  # 24 fps, 5 s per clip, one GPU of 48 GB without offloading anything but the text encoder.
  wan2.2-ti2v-5b:
    label: "Wan 2.2 TI2V 5B"
    licence: Apache-2.0
    licenceUrl: https://huggingface.co/Wan-AI/Wan2.2-TI2V-5B-Diffusers
    pipeline: wan
    repo: Wan-AI/Wan2.2-TI2V-5B-Diffusers
    revision: b8fff7315c768468a5333511427288870b2e9635
    fps: 24
    maxFrames: 121          # Wan wants 4k+1 frames: 121 = 5 s at 24 fps
    steps: 40
    guidance: 5.0
    multiple: 32            # the 5B's VAE compresses 16x16 and its transformer patches 2x2
    # Text and image to video (diffusers WanImageToVideoPipeline with expand_timesteps, the checkpoint's own
    # config): a starting photo is cut to the aspect around its subject, never letterboxed.
    imageToVideo: true
    expandTimesteps: true   # the 5B conditions its first latent frame on the photo (the checkpoint's own config)
    sizes:
      "9:16": [704, 1280]
      "16:9": [1280, 704]
      "1:1": [960, 960]
    # A 20 GB card (profile small) runs the model with CPU offload; if 1280x704 does not fit it, the
    # next size is tried and the run says which one it made.
    fallbackSizes:
      "9:16": [[544, 960], [480, 832]]
      "16:9": [[960, 544], [832, 480]]
      "1:1": [[768, 768]]
    vramGb: 30              # bf16 transformer 10 GB + activations at 704x1280x121; text encoder offloaded
    ramGb: 24
    downloadGb: 34.2
    hardware: [cuda]

  # Wan 2.2 T2V A14B run HERE (profile `hero`, an 80 GB card: RunPod H100/A100) — the 720p showcase model. Two 14B experts
  # (high-noise then low-noise, `boundary_ratio` 0.875 in the checkpoint) loaded in bf16 and swapped through the card by
  # CPU offload: ~57 GB of weights, ~64 GB of host RAM. 1280x720 (and 720x1280), 81 frames = 5 s at 16 fps. The provider-served
  # `wan2-2-t2v-a14b` below is the same model at 832x480 on DigitalOcean's serverless inference; this one is ours, at 720p.
  wan2.2-t2v-a14b:
    label: "Wan 2.2 T2V A14B (720p, GPU)"
    licence: Apache-2.0
    licenceUrl: https://huggingface.co/Wan-AI/Wan2.2-T2V-A14B-Diffusers
    pipeline: wan
    repo: Wan-AI/Wan2.2-T2V-A14B-Diffusers
    revision: 5be7df9619b54f4e2667b2755bc6a756675b5cd7
    fps: 16
    maxFrames: 81           # 4k+1: 81 = 5 s at 16 fps
    steps: 40
    guidance: 4.0           # the high-noise expert; the low-noise one takes `guidanceTwo`
    guidanceTwo: 3.0
    multiple: 16
    sizes:
      "16:9": [1280, 720]
      "9:16": [720, 1280]
      "1:1": [960, 960]
    vramGb: 70
    ramGb: 64
    downloadGb: 126         # the checkpoint's fp32 shards (two experts x 57 GB + the umt5 text encoder 11 GB)
    hardware: [cuda]

  # Wan 2.2 I2V A14B — the shots of a cinematic short (ADR-080, krizaka/orazaka): every shot starts from its keyframe
  # (a FLUX still of the shot list), so a character and a look carry from shot to shot. Two 14B experts like the T2V,
  # driven in FOUR steps by lightx2v's distilled LoRAs (Apache-2.0): ~1.5 min a 720p clip on an 80 GB card instead of
  # ~18 min at 40 steps. It starts from a photo or not at all. Its weights (115 GB of fp32 shards) live on the pod's
  # container disk (`cache: scratch`), fetched at the pod's start, not on the shared models volume: the volume is full
  # with the T2V experts and a bigger one is a monthly cost. The text encoder is the 5B's bf16 umt5-xxl.
  wan2.2-i2v-a14b:
    label: "Wan 2.2 I2V A14B (720p, 4-step distill)"
    licence: Apache-2.0
    licenceUrl: https://huggingface.co/Wan-AI/Wan2.2-I2V-A14B-Diffusers
    pipeline: wan
    repo: Wan-AI/Wan2.2-I2V-A14B-Diffusers
    revision: 596658fd9ca6b7b71d5057529bbf319ecbc61d74
    textEncoderFrom: wan2.2-ti2v-5b
    cache: scratch
    imageToVideo: true
    requiresImage: true
    fps: 16
    maxFrames: 81           # 4k+1: 81 = 5 s at 16 fps
    steps: 4
    guidance: 1.0           # a distilled model takes no classifier-free guidance (one pass per step)
    guidanceTwo: 1.0
    multiple: 16
    sizes:
      "16:9": [1280, 720]
      "9:16": [720, 1280]
      "1:1": [960, 960]
    lora:
      repo: lightx2v/Wan2.2-Distill-Loras
      revision: 57adea585d1d21085e2dfc91ce3c7b646cdd9345
      licence: Apache-2.0
      high: wan2.2_i2v_A14b_high_noise_lora_rank64_lightx2v_4step_1022.safetensors
      low: wan2.2_i2v_A14b_low_noise_lora_rank64_lightx2v_4step_1022.safetensors
    vramGb: 70
    ramGb: 64
    downloadGb: 116
    hardware: [cuda]

  # Wan 2.2 I2V A14B at its full schedule — the bake-off's winner for people and animals in 9:16 (docs/_generated/MEASURED_RUNS.md): the same
  # checkpoint as the distilled model above (one fetch serves both), undistilled: 40 steps, guidance 3.5 on both experts, 81 frames at 16 fps.
  # About 18 minutes a 720p clip on an H100 (peak 35 GB with model offload): the finish of a hero clip, not the iteration.
  wan2.2-i2v-a14b-hq:
    label: "Wan 2.2 I2V A14B (720p, 40 steps)"
    licence: Apache-2.0
    licenceUrl: https://huggingface.co/Wan-AI/Wan2.2-I2V-A14B-Diffusers
    pipeline: wan
    repo: Wan-AI/Wan2.2-I2V-A14B-Diffusers
    revision: 596658fd9ca6b7b71d5057529bbf319ecbc61d74
    textEncoderFrom: wan2.2-ti2v-5b
    cache: scratch
    imageToVideo: true
    requiresImage: true
    fps: 16
    maxFrames: 81
    steps: 40
    guidance: 3.5
    guidanceTwo: 3.5
    multiple: 16
    sizes:
      "16:9": [1280, 720]
      "9:16": [720, 1280]
      "1:1": [960, 960]
    vramGb: 70
    ramGb: 64
    downloadGb: 116
    hardware: [cuda]

  # LTX-Video 0.9.8 13B distilled (Lightricks) — the fast model of the bake-off (docs/_generated/MEASURED_RUNS.md): a 5 s clip at
  # 1216x704 (or 704x1216) and 24 fps in 8 steps without guidance, about 14 s on an H100 and 39 GB of VRAM, from a still or from text.
  # Licence: the LTX-Video Open Weights License 0.X (grant, no revenue clause — unlike LTX-2's community licence, which is not used).
  # Frames are counted 8k+1; sizes are multiples of 32.
  ltx-video-0.9.8-13b-distilled:
    label: "LTX-Video 0.9.8 13B distilled"
    licence: LTX-Video-Open-Weights-0.X
    licenceUrl: https://huggingface.co/Lightricks/LTX-Video-0.9.8-13B-distilled/blob/main/LTX-Video-Open-Weights-License-0.X.txt
    pipeline: ltx
    cache: scratch          # the models volume has 35 GB free: ~45 GB of weights go to the host's own disk, fetched at the pod's start
    repo: Lightricks/LTX-Video-0.9.8-13B-distilled
    revision: 7c64400e1861cc0d7b98d570a1926d5408ec60cd
    imageToVideo: true
    fps: 24
    maxFrames: 121          # 8k+1: 121 = 5 s at 24 fps
    steps: 8
    guidance: 1.0           # distilled: no classifier-free guidance
    multiple: 32
    sizes:
      "16:9": [1216, 704]
      "9:16": [704, 1216]
      "1:1": [768, 768]
    vramGb: 39
    ramGb: 32
    downloadGb: 45
    hardware: [cuda]

  # Wan 2.1 T2V 1.3B — the dev video model of the GPU droplet `small` (RTX 4000 Ada, 20 GB). 480p
  # class (480x832 vertical) at 16 fps. Its text encoder is the same umt5-xxl as Wan 2.2's, read in
  # bf16 from the 5B's repository: 11.4 GB instead of the 22.7 GB float32 copy its own repository holds.
  wan2.1-t2v-1.3b:
    label: "Wan 2.1 T2V 1.3B"
    licence: Apache-2.0
    licenceUrl: https://huggingface.co/Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    pipeline: wan
    repo: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    revision: 0fad780a534b6463e45facd96134c9f345acfa5b
    textEncoderFrom: wan2.2-ti2v-5b
    fps: 16
    maxFrames: 81           # 5 s at 16 fps
    steps: 30
    guidance: 5.0
    multiple: 16
    sizes:
      "9:16": [480, 832]
      "16:9": [832, 480]
      "1:1": [624, 624]
    vramGb: 10
    ramGb: 16
    downloadGb: 6.2
    hardware: [cuda]

  # Wan 2.2 T2V A14B — served by DigitalOcean serverless inference, routed by Orazaka (app/remote_video.py):
  # the catalogue row points at the provider `do-inference`, the clip is made there, and the run, its seed, its
  # metering and its sealed asset are Orazaka's. Nothing is downloaded or run on this host. 5 s per clip.
  wan2-2-t2v-a14b:
    label: "Wan 2.2 T2V A14B (DigitalOcean serverless)"
    licence: Apache-2.0
    licenceUrl: https://huggingface.co/Wan-AI/Wan2.2-T2V-A14B
    pipeline: remote
    provider: do-inference
    remoteModel: wan2-2-t2v-a14b
    costUsd: 0.60            # per video, docs.digitalocean.com/products/inference/details/pricing
    fps: 16
    maxFrames: 81
    steps: 0                 # the provider's own
    multiple: 16
    # Measured 2026-10-15 through the gateway: whatever `size` is asked (720x1280, 480x832, 1280x720) and with or
    # without aspect_ratio/resolution, the clip is 832x480, 81 frames, 5.06 s @ 16 fps — so that is the only
    # shape declared. A 9:16 request is refused by name rather than answered with a landscape clip. Seeds are
    # honoured: the same prompt and seed gave byte-identical frames across four calls.
    sizes:
      "16:9": [832, 480]
    hardware: [remote]

  # The Mac's model (Metal), served by app/mlx_generator.py. Listed so the aspect of a Studio reaches
  # it too: SD 1.5 sizes, multiples of 8.
  animatediff-lightning-mps:
    label: "AnimateDiff Lightning (MPS)"
    licence: CreativeML OpenRAIL-M
    pipeline: animatediff
    fps: 12
    maxFrames: 16
    steps: 8
    multiple: 8
    sizes:
      "9:16": [432, 768]
      "16:9": [768, 432]
      "1:1": [512, 512]
    hardware: [mps]

# The image engine is stable-diffusion.cpp's sd-server, the same backend as the Mac (ADR-075); on the
