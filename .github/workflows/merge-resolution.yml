# Merge resolution (krizaka/krizaka-internal#2000): fails a PR that drops what main added meanwhile, or deletes generated content, with no
# `deletion-explained:` line in its description. Logic in krizaka/.github (rule `merge-resolution` of docs/standards/rules.json).
name: Merge resolution

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  guard:
    name: Merge resolution
    uses: krizaka/.github/.github/workflows/merge-resolution.yml@78dc5cbc0f0e0cf684a7e89d0d736893134e80a2 # main
    permissions:
      contents: read
