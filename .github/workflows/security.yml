# Security scan: gitleaks (secrets, whole history of the pull request) and zizmor (GitHub Actions vulnerabilities).
# Logic lives in krizaka/.github (reusable, rule `security-scan` of docs/standards/rules.json). Pin by commit SHA:
# `node scripts/pin-supply-chain.mjs` (and `--refresh` to move it).
name: Security scan

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

jobs:
  security:
    name: Security scan
    uses: krizaka/.github/.github/workflows/security-scan.yml@b53d9fa9dc1c759d7a27709059dc99f867c63e5b # main
    permissions:
      contents: read
