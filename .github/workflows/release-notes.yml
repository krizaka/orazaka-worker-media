# A GitHub Release for every merge that has news (krizaka/.github#184): English and French, tagged YYYY.MM.DD.N, read by
# krizaka.com's changelog. Add `Release-note-en:` / `Release-note-fr:` lines to a PR to word its line yourself.
name: Release notes

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    permissions:
      contents: write
    uses: krizaka/.github/.github/workflows/release-notes.yml@8a90a66bec6c227af139b39c6c33ba58b400b59a # main
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
